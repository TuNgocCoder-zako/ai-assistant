[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-ai"
version = "2.4.0"
description = "Local AI OS Agent & Voice Assistant for Arch Linux / Hyprland"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ctranslate2>=4.8.0",
    "piper-tts>=1.2.0",
    "faster-whisper>=1.2.0",
    "numpy>=1.26.0",
    "openwakeword>=0.4.0",
    "requests>=2.31.0",
    "scipy>=1.11.0",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ai-assistant = "ai_assistant.app:main"
alexa-voice = "ai_assistant.app:main"

[tool.setuptools.packages.find]
where = ["src"]
